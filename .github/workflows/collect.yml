name: Collect deals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AFFILIATE_TAGS: ${{ secrets.AFFILIATE_TAGS }}
        run: python run.py

      - name: Commit audit log
        run: |
          git config user.name "geekdeal-bot"
          git config user.email "bot@geekdeal.local"
          git add data/raw
          git diff --staged --quiet || git commit -m "chore: audit log"
          git push
